events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ============================================
    # HTTP (Porta 80) - Redireciona para HTTPS
    # ============================================
    server {
        listen 80;
        server_name leiriadetail.pt www.leiriadetail.pt api.leiriadetail.pt graphql.leiriadetail.pt;

        # Rota para o Certbot validar o domínio
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirecionar para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================
    # FRONTEND (HTTPS)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name leiriadetail.pt www.leiriadetail.pt;

        ssl_certificate /etc/letsencrypt/live/leiriadetail.pt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/leiriadetail.pt/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # API (HTTPS)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name api.leiriadetail.pt;

        ssl_certificate /etc/letsencrypt/live/leiriadetail.pt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/leiriadetail.pt/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # GRAPHQL (HTTPS)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name graphql.leiriadetail.pt;

        ssl_certificate /etc/letsencrypt/live/leiriadetail.pt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/leiriadetail.pt/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://graphql:4001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}