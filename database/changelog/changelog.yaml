# basedados/changelog/changelog.yaml
databaseChangeLog:
  # 1. Estrutura (Tabelas) - Executa primeiro
  - includeAll:
      path: tables
      runOnChange: true
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true
      
  # 2. Dados (Seed) - Executa depois das tabelas
  - includeAll:
      path: seed
      runOnChange: true
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true