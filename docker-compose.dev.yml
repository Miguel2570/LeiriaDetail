version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leiriadetail-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leiriadetail}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5434"  # ← Ambos 5434
    command: -p 5434  # ← Força PostgreSQL a usar porta 5434
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5434 -U ${DB_USER:-postgres}"]  # ← healthcheck na 5434
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: leiriadetail-dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@leiriadetail.pt
      PGADMIN_DEFAULT_PASSWORD: dev_pgadmin_123
    ports:
      - "5052:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: leiriadetail-dev-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: leiriadetail-dev-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - esdata_dev:/usr/share/elasticsearch/data

  liquibase:
    image: liquibase/liquibase:4.25
    container_name: leiriadetail-dev-liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5434/${DB_NAME:-leiriadetail}
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/changelog:/liquibase/changelog
    working_dir: /liquibase/changelog
    command: update

volumes:
  pgdata_dev:
  esdata_dev:
  redisdata_dev: