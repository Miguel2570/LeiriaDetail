input CreateServiceInput {
  name: String!
  clientId: Int!
  vehicleId: Int!
  serviceType: String!
  priceAB: Float!
  priceC: Float!
  priceDE: Float!
  observations: String
  entryChecks: [String]
  estimatedValue: Float
}

input UpdateChecklistInput {
    serviceId: Int!
    checklist: [String!]!
    notes: String
    progress: Int!
}

input CompleteServiceInput {
    serviceId: Int!
    totalValue: Float
}