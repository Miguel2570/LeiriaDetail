# src/schema/auth/auth.types.graphql

type User {
  id: ID!
  email: String!
  username: String!
  firstName: String
  lastName: String
  isEmailVerified: Boolean!
  createdAt: String!
  updatedAt: String
}

type Tokens {
  accessToken: String!
  refreshToken: String!
  expiresIn: Int!
}

type Error {
  field: String!
  message: String!
  code: String!
}

type AuthPayload {
  user: User
  tokens: Tokens
  message: String
  errors: [Error!]!
}

type VerifyAccountPayload {
  success: Boolean!
  message: String!
}

type SimpleResponse {
  hasError: Boolean!
  message: String!
}

type CheckEmailPayload {
  exists: Boolean!
  message: String
}

type CheckTokenPayload {
  isValid: Boolean!
  message: String
  email: String
}

type VerifyPasswordPayload {
  success: Boolean!
  errors: [Error!]
  hasError: Boolean!
}