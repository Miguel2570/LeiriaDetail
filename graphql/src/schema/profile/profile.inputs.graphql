# src/graphql/profile/profile.inputs.graphql

input UpdateProfileInput {
    firstName: String
    lastName: String
    phone: String
}

input ChangePasswordInput {
    currentPassword: String!
    newPassword: String!
}

# ✅ NOVO - Input para upload de avatar
input UpdateAvatarInput {
    imageData: String!         # base64 puro (sem prefixo data:)
    imageExtension: String!    # jpg, png, webp, etc.
    imageSize: Int!           # tamanho em bytes
}

input CreateStaffInput {
    firstName: String!
    lastName: String!
    email: String!
    password: String!
    phone: String
    role: String
}