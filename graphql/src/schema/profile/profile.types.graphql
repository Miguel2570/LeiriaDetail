# src/graphql/profile/profile.types.graphql

type Profile {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  avatarFileId: String        # ✅ UUID do File
  avatarData: String          # ✅ base64
  avatarExtension: String     # ✅ extensão (jpg, png, etc.)
  isVerified: Boolean!
  createdAt: String!
  updatedAt: String
}

type ProfileOutput {
  profile: Profile
  message: String
  hasError: Boolean!
  error: ErrorField
}

type UpdateProfileOutput {
  firstName: String
  lastName: String
  phone: String
  message: String
  hasError: Boolean!
  error: ErrorField
}

type UpdatePasswordOutput {
  message: String
  hasError: Boolean!
  error: ErrorField
}