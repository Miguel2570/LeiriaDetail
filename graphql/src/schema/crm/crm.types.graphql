type HistoryRecord {
    id: ID!
    vehicleId: ID!
    date: String!
    service: String!
    status: String!
    price: Float!
}

type Client {
    id: ID!
    name: String!
    phone: String!
    email: String!
    ltv: String!
    avatar: String!
    vehicles: [Vehicle!]!
    history: [HistoryRecord!]!
}

type CRMData {
    clients: [Client!]
    client: Client
    errors: [Error!]!
}