type Booking {
  id: ID!
  userId: Int!
  bookingDate: String!
  bookingTime: String!
  status: String!
  vehicleName: String
  vehiclePlate: String
  serviceName: String
  servicePrice: Float
  createdAt: String
}

type BookingOutput {
  booking: Booking
  message: String
  hasError: Boolean!
  error: ErrorField
}

type SlotOutput {
  date: String
  availableSlots: [String!]
  occupiedSlots: [String!]
  hasError: Boolean!
  error: ErrorField
}

type PriceOutput {
  vehicleCategory: String
  serviceName: String
  price: Float
  durationMinutes: Int
  hasError: Boolean!
  error: ErrorField
}