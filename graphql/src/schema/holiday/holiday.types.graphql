
type BlockedDate {
    id: ID!
    date: String!
    reason: String!
    isRecurring: Boolean
}

type HolidayOutput {
    dates: [BlockedDate!]!
    hasError: Boolean!
    error: ErrorField
}

type HolidayMutationOutput {
    date: BlockedDate
    message: String
    hasError: Boolean!
    error: ErrorField
}