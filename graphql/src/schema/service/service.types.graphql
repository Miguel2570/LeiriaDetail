type Service {
    id: ID!
    name: String!
    description: String
    longDescription: String
    priceAB: Float!
    priceC: Float!
    priceDE: Float!
    durationMinutes: Int
    durationDetails: String
    packType: String
    icon: String
    includes: [String!]
    processSteps: [ProcessStep!]
    loyaltyPoints: Int
}

type ProcessStep {
    step: Int!
    title: String!
    description: String!
}

type ErrorField {
    field: String
    message: String
}

type ServiceOutput {
    services: [Service!]
    message: String
    hasError: Boolean!
    error: ErrorField
}