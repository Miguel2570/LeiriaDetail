version: '3.8'

services:
  # ============================================
  # 1. FRONTEND (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.leiriadetail.pt}
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-https://graphql.leiriadetail.pt}
    container_name: leiriadetail-frontend
    restart: unless-stopped
    networks:
      - leiria_network
    depends_on:
      - api
      - graphql

  # ============================================
  # 2. API (Node.js)
  # ============================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: leiriadetail-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-leiriadetail}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-leiriadetail}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ES_HOST: http://elastic:${ES_PASSWORD}@elasticsearch:9200
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://leiriadetail.pt,https://www.leiriadetail.pt}
    networks:
      - leiria_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # 3. GRAPHQL (Node.js)
  # ============================================
  graphql:
    build:
      context: ./graphql
      dockerfile: Dockerfile
    container_name: leiriadetail-graphql
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      API_URL: http://api:3001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://leiriadetail.pt,https://www.leiriadetail.pt}
    networks:
      - leiria_network
    depends_on:
      - api

  # ============================================
  # 4. POSTGRESQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: leiriadetail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leiriadetail}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - leiria_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 5. ELASTICSEARCH
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: leiriadetail-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - leiria_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # 6. KIBANA
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: leiriadetail-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - leiria_network

  # ============================================
  # 7. REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: leiriadetail-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - leiria_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # 8. LIQUIBASE (Migrações)
  # ============================================
  liquibase:
    image: liquibase/liquibase:4.25
    container_name: leiriadetail-liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-leiriadetail}
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/changelog:/liquibase/changelog
    networks:
      - leiria_network
    working_dir: /liquibase/changelog
    command: update

  # ============================================
  # 9. NGINX REVERSE PROXY (HTTPS)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: leiriadetail-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - frontend
      - api
      - graphql
    networks:
      - leiria_network

  # ============================================
  # 10. CERTBOT (SSL)
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: leiriadetail-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  leiria_network:
    driver: bridge

volumes:
  pgdata:
  esdata:
  redisdata:
  certbot_data:
  certbot_certs: